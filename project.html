<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RODGE QRally Log</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --safety-yellow: #FFD700;
            --pure-white: #FFFFFF;
            --pit-black: #121212;
            --card-bg: #1A1A1A;
            --psi-cold: #00D1FF;
            --psi-hot: #FF8C00;
            --tread-green: #20b2aa;
        }

        body {
            background-color: var(--pit-black);
            color: var(--safety-yellow);
            font-family: 'Arial', sans-serif;
            margin: 0; padding: 10px;
            display: flex; flex-direction: column; align-items: center;
        }

        #capture-area {
            width: 100%; max-width: 450px;
            background-color: var(--pit-black);
            padding: 15px; box-sizing: border-box;
        }

        .header { border-bottom: 2px solid var(--safety-yellow); margin-bottom: 12px; padding-bottom: 8px; }
        .brand { font-size: 1.8rem; font-weight: 900; text-transform: uppercase; margin: 0; }
        .title { font-size: 1.1rem; color: var(--pure-white); text-transform: uppercase; margin: 2px 0 8px 0; }

        .session-meta-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            background: #111; padding: 8px; border-radius: 6px; border: 1px solid #333;
        }
        .meta-box { text-align: center; }
        .meta-box label { display: block; font-size: 0.6rem; font-weight: bold; color: var(--safety-yellow); margin-bottom: 3px; text-transform: uppercase; }
        .meta-input {
            width: 100%; height: 32px; background: #222; color: white;
            border: 1px solid #444; text-align: center; border-radius: 4px;
            font-weight: bold; font-size: 0.9rem; box-sizing: border-box;
        }

        .tyre-card {
            border: 2px solid var(--safety-yellow);
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px; margin-bottom: 12px;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .tyre-id { font-size: 1.8rem; font-weight: bold; line-height: 1; }

        .compound-select {
            background: #111; color: var(--safety-yellow);
            border: 1px solid var(--safety-yellow); border-radius: 4px;
            padding: 4px 6px; font-weight: bold; font-size: 0.8rem;
        }

        .data-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #111; padding: 8px; border-radius: 6px; margin-bottom: 10px;
        }

        .input-box { text-align: center; }
        .input-box label { display: block; font-size: 0.6rem; font-weight: bold; margin-bottom: 3px; }
        
        .compact-input {
            width: 50px; height: 30px; background: #222; color: white;
            border: 1px solid #444; text-align: center; border-radius: 4px;
            font-weight: bold; font-size: 0.9rem;
        }
        .compact-input.cold { border-color: var(--psi-cold); }
        .compact-input.hot { border-color: var(--psi-hot); }
        .compact-input.tread { border-color: var(--tread-green); }

        .delta-display { font-size: 0.75rem; color: #aaa; font-weight: bold; }

        .temp-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .label { font-size: 0.65rem; color: #888; text-transform: uppercase; margin-bottom: 4px; text-align: center; }

        .temp-input {
            width: 100%; height: 45px; background: #2A2A2A; color: white;
            border: 1px solid #444; border-radius: 6px; text-align: center;
            font-size: 1.2rem; font-weight: bold; box-sizing: border-box;
        }

        .timestamp { font-size: 0.7rem; color: #555; margin-top: 10px; text-align: right; }

        .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; width: 100%; max-width: 450px; }
        .btn { flex: 1; min-width: 130px; padding: 12px; border-radius: 6px; font-weight: bold; border: none; text-transform: uppercase; cursor: pointer; }
        .save-btn { background: var(--safety-yellow); color: black; }
        .local-btn { background: #20b2aa; color: black; }
        .reset-btn { background: #222; color: #cc0000; border: 1px solid #cc0000; }

        .history-section {
            width: 100%; max-width: 450px; margin-top: 25px;
            border-top: 2px solid var(--safety-yellow); padding-top: 15px; box-sizing: border-box;
        }
        .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .history-title { font-size: 1.2rem; font-weight: 900; text-transform: uppercase; }
        .clear-btn { background: transparent; color: #cc0000; border: 1px solid #cc0000; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }

        .history-card {
            background: #1A1A1A; border: 1px solid #333; border-radius: 8px;
            padding: 10px; margin-bottom: 10px; font-size: 0.8rem; color: #fff;
        }
        .history-time { font-size: 0.7rem; color: var(--safety-yellow); font-weight: bold; display: flex; justify-content: space-between; }
        .history-meta { font-size: 0.75rem; color: #ccc; margin-top: 4px; font-weight: bold; }
        .history-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 8px; }
        .history-tyre-item { background: #111; padding: 6px; border-radius: 4px; border-left: 3px solid var(--safety-yellow); }
        .history-notes { margin-top: 8px; font-size: 0.75rem; color: #aaa; font-style: italic; border-top: 1px solid #222; padding-top: 4px; }
        .del-item { color: #ff4444; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="capture-area">
        <div class="header">
            <div class="brand">RODGE QRally</div>
            <div class="title">Tyre & Pyrometer Log</div>
            <div class="session-meta-grid">
                <div class="meta-box">
                    <label>Stage Dist (mi)</label>
                    <input type="number" step="0.1" id="stage-dist" class="meta-input" placeholder="0.0">
                </div>
                <div class="meta-box">
                    <label>Ambient (°C)</label>
                    <input type="number" step="1" id="ambient-temp" class="meta-input" placeholder="15">
                </div>
            </div>
        </div>

        <div id="log-container"></div>

        <div style="margin-top:10px;">
            <div class="label" style="text-align:left; color:var(--safety-yellow);">Session Notes</div>
            <textarea id="notes" rows="2" style="width:100%; background:#1A1A1A; color:white; border:1px solid #444; padding:8px; border-radius:8px; box-sizing:border-box;"></textarea>
        </div>
        <div class="timestamp" id="ts-display"></div>
    </div>

    <div class="btn-row">
        <button class="btn local-btn" onclick="saveToLocalStorage()">Save To History</button>
        <button class="btn save-btn" id="save-btn" onclick="saveSnapshot()">Save / Share</button>
        <button class="btn reset-btn" onclick="if(confirm('Reset current inputs?')) resetForm()">Reset Form</button>
    </div>

    <div class="history-section">
        <div class="history-header">
            <div class="history-title">Saved Sessions</div>
            <button class="clear-btn" onclick="clearAllHistory()">Clear All</button>
        </div>
        <div id="history-container"></div>
    </div>

    <script>
        const tyres = [
            { id: 'LF', labels: ['Inner', 'Mid', 'Outer'] },
            { id: 'RF', labels: ['Outer', 'Mid', 'Inner'] },
            { id: 'LR', labels: ['Inner', 'Mid', 'Outer'] },
            { id: 'RR', labels: ['Outer', 'Mid', 'Inner'] }
        ];

        const compounds = ['Soft', 'Medium', 'Hard', 'Intermediate', 'Full Wet', 'Mould Slick'];

        const container = document.getElementById('log-container');
        tyres.forEach((t, i) => {
            container.innerHTML += `
                <div class="tyre-card">
                    <div class="card-header">
                        <div class="tyre-id">${t.id}</div>
                        <select class="compound-select" id="compound-${i}">
                            ${compounds.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </div>

                    <div class="data-bar">
                        <div class="input-box">
                            <label style="color:var(--psi-cold)">COLD PSI</label>
                            <input type="number" step="0.5" class="compact-input cold" id="cold-${i}" oninput="calcDelta(${i})">
                        </div>
                        <div class="input-box">
                            <label style="color:var(--psi-hot)">HOT PSI</label>
                            <input type="number" step="0.5" class="compact-input hot" id="hot-${i}" oninput="calcDelta(${i})">
                        </div>
                        <div class="delta-display" id="delta-${i}">Δ 0.0</div>
                        <div class="input-box">
                            <label style="color:var(--tread-green)">TREAD (mm)</label>
                            <input type="number" step="0.5" class="compact-input tread" id="tread-${i}">
                        </div>
                    </div>

                    <div class="temp-group">
                        ${t.labels.map((l, j) => `<div><div class="label">${l}</div><input type="number" class="temp-input" id="temp-${i}-${j}" oninput="updateTemp(this)"></div>`).join('')}
                    </div>
                </div>`;
        });

        function updateTemp(el) {
            const val = parseFloat(el.value);
            if (isNaN(val)) { el.style.backgroundColor = "#2A2A2A"; return; }
            el.style.backgroundColor = val < 70 ? "#0052cc" : (val <= 90 ? "#2d8a2d" : "#cc0000");
        }

        function calcDelta(index) {
            const cold = parseFloat(document.getElementById(`cold-${index}`).value) || 0;
            const hot = parseFloat(document.getElementById(`hot-${index}`).value) || 0;
            const delta = (hot - cold).toFixed(1);
            document.getElementById(`delta-${index}`).innerText = `Δ ${delta > 0 ? '+' + delta : delta}`;
        }

        function resetForm() {
            document.getElementById('stage-dist').value = '';
            document.getElementById('ambient-temp').value = '';
            tyres.forEach((_, i) => {
                document.getElementById(`cold-${i}`).value = '';
                document.getElementById(`hot-${i}`).value = '';
                document.getElementById(`tread-${i}`).value = '';
                document.getElementById(`delta-${i}`).innerText = 'Δ 0.0';
                [0, 1, 2].forEach(j => {
                    const tempEl = document.getElementById(`temp-${i}-${j}`);
                    tempEl.value = '';
                    tempEl.style.backgroundColor = "#2A2A2A";
                });
            });
            document.getElementById('notes').value = '';
        }

        function saveToLocalStorage() {
            const timeStr = new Date().toLocaleString();
            const logData = {
                id: Date.now(),
                timestamp: timeStr,
                stageDist: document.getElementById('stage-dist').value || '-',
                ambientTemp: document.getElementById('ambient-temp').value || '-',
                notes: document.getElementById('notes').value,
                tyresData: tyres.map((t, i) => ({
                    id: t.id,
                    compound: document.getElementById(`compound-${i}`).value,
                    cold: document.getElementById(`cold-${i}`).value || '-',
                    hot: document.getElementById(`hot-${i}`).value || '-',
                    tread: document.getElementById(`tread-${i}`).value || '-',
                    temps: [
                        document.getElementById(`temp-${i}-0`).value || '-',
                        document.getElementById(`temp-${i}-1`).value || '-',
                        document.getElementById(`temp-${i}-2`).value || '-'
                    ]
                }))
            };

            const existingHistory = JSON.parse(localStorage.getItem('qrally_logs') || '[]');
            existingHistory.unshift(logData);
            localStorage.setItem('qrally_logs', JSON.stringify(existingHistory));

            renderHistory();
            alert('Saved to LocalStorage!');
        }

        function renderHistory() {
            const historyContainer = document.getElementById('history-container');
            const history = JSON.parse(localStorage.getItem('qrally_logs') || '[]');

            if (history.length === 0) {
                historyContainer.innerHTML = '<div style="color:#666; font-size:0.8rem; text-align:center;">No saved logs found on this device.</div>';
                return;
            }

            historyContainer.innerHTML = history.map(item => `
                <div class="history-card">
                    <div class="history-time">
                        <span>${item.timestamp}</span>
                        <span class="del-item" onclick="deleteHistoryItem(${item.id})">✕ Delete</span>
                    </div>
                    <div class="history-meta">
                        Dist: ${item.stageDist} mi | Ambient: ${item.ambientTemp}°C
                    </div>
                    <div class="history-grid">
                        ${item.tyresData.map(t => `
                            <div class="history-tyre-item">
                                <strong>${t.id}</strong> (${t.compound})<br>
                                PSI: ${t.cold} → ${t.hot} | Tread: ${t.tread}mm<br>
                                Temps: ${t.temps.join('/')}°C
                            </div>
                        `).join('')}
                    </div>
                    ${item.notes ? `<div class="history-notes">Notes: ${item.notes}</div>` : ''}
                </div>
            `).join('');
        }

        function deleteHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem('qrally_logs') || '[]');
            history = history.filter(item => item.id !== id);
            localStorage.setItem('qrally_logs', JSON.stringify(history));
            renderHistory();
        }

        function clearAllHistory() {
            if (confirm('Delete all history saved on this device?')) {
                localStorage.removeItem('qrally_logs');
                renderHistory();
            }
        }

        async function saveSnapshot() {
            const saveBtn = document.getElementById('save-btn');
            saveBtn.innerText = "Generating...";
            document.getElementById('ts-display').innerText = "Logged: " + new Date().toLocaleString();

            try {
                const canvas = await html2canvas(document.getElementById('capture-area'), {
                    backgroundColor: "#121212",
                    scale: 2,
                    useCORS: true,
                    allowTaint: true
                });

                canvas.toBlob(async (blob) => {
                    const fileName = `QRally_Log_${Date.now()}.png`;
                    const file = new File([blob], fileName, { type: 'image/png' });

                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        try {
                            await navigator.share({
                                files: [file],
                                title: 'QRally Tyre Log',
                                text: 'RODGE QRally Tyre & Pyrometer Log'
                            });
                            saveBtn.innerText = "Save / Share";
                            return;
                        } catch (err) {
                            if (err.name !== 'AbortError') console.error(err);
                        }
                    }

                    const imgUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.download = fileName;
                    link.href = imgUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    setTimeout(() => {
                        const newWin = window.open();
                        if (newWin) {
                            newWin.document.write(`<body style="margin:0;background:#121212;display:flex;justify-content:center;align-items:center;min-height:100vh;"><img src="${imgUrl}" style="max-width:100%;height:auto;"/></body>`);
                        }
                        saveBtn.innerText = "Save / Share";
                    }, 300);

                }, 'image/png');
            } catch (e) {
                alert('Snapshot failed: ' + e.message);
                saveBtn.innerText = "Save / Share";
            }
        }

        renderHistory();
    </script>
</body>
</html>
